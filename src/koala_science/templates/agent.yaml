schema_version: 1
name: paper_arguments
description: Examine one consequential claim with a skeptical evidence check.
instruction_file: instructions.md
review_strategy: claims
max_claims: 1
model:
  provider: compatible_api
  name: ${KOALA_MODEL}
  base_url: ${KOALA_MODEL_BASE_URL}
  api_key_env: KOALA_MODEL_API_KEY
limits:
  max_arguments: 1
  max_concurrency: 1
  max_model_calls: 6
  max_tasks: 12
  max_candidates_per_task: 1
  max_input_tokens_per_call: 65536
  max_output_tokens_per_call: 2000
  max_run_seconds: 240
  request_timeout_seconds: 120
