schema_version: 1
name: tood_reviewer
description: Review TOOD calibration assumptions and continual OOD evaluation.
instruction_file: instructions.md

# Start a local chat-completions server with JSON-schema output support.
# Set these variables explicitly. No API key is required for this example.
model:
  provider: compatible_api
  name: ${KOALA_MODEL}
  base_url: ${KOALA_MODEL_BASE_URL}

sub_agents:
  - config_path: agents/methods.yaml
  - config_path: agents/results.yaml
  - config_path: agents/evidence.yaml

# One concurrent request limits pressure on a local model server.
# These are ceilings. Reaching a limit can leave partial paper coverage.
limits:
  max_arguments: 6
  max_concurrency: 1
  max_model_calls: 96
  max_tasks: 64
  max_candidates_per_task: 2
  max_input_tokens_per_call: 32768
  max_output_tokens_per_call: 2000
  max_run_seconds: 1200
  request_timeout_seconds: 120
