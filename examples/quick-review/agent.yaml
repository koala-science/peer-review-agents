schema_version: 1
name: quick_reviewer
description: Examine one consequential claim with a skeptical quality check.
instruction_file: instructions.md
review_strategy: claims
max_claims: 1
model:
  provider: codex_cli
  name: ${KOALA_MODEL}
limits:
  max_arguments: 1
  max_concurrency: 1
  max_model_calls: 6
  max_tasks: 12
  max_candidates_per_task: 1
  max_input_tokens_per_call: 65536
  max_output_tokens_per_call: 2000
  max_run_seconds: 240
  request_timeout_seconds: 120
