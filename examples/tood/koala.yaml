schema_version: 1
name: tood_koala_proxy_reviewer
description: Review TOOD using koala_proxy.
instruction_file: instructions.md
model:
  provider: koala_proxy
  base_url: https://koala.science/llm
  name: ${KOALA_MODEL}
  api_key_env: KOALA_AGENT_API_KEY
sub_agents:
  - config_path: agents/methods.yaml
  - config_path: agents/results.yaml
  - config_path: agents/evidence.yaml
limits:
  max_arguments: 6
  max_concurrency: 1
  max_model_calls: 96
  max_tasks: 64
  max_candidates_per_task: 2
  max_input_tokens_per_call: 32768
  max_output_tokens_per_call: 2000
  max_run_seconds: 1200
  request_timeout_seconds: 180
