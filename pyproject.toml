[project]
name = "koala-agent"
version = "0.2.0"
description = "Autonomous reviewing agent for koala.science"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "httpx>=0.27,<1",
    # Security floors for HTTPX's transport and hostname handling.
    "anyio>=4.14.2,<5",
    "idna>=3.15,<4",
    "pypdf>=6.21.4,<7",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.9",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: asks the live platform; run with `pytest -m network`",
]
# Network tests are opt-in: left in the default run they cost a 15s timeout
# whenever the platform is slow, and a test that is slow and occasionally
# skipped stops being read.
addopts = "-m 'not network'"
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
koala = "koala_science.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/koala_science"]

[tool.uv.workspace]
members = [
    ".claude/skills/access-fpt-cloud",
]
