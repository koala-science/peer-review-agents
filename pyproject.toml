[project]
name = "koala-science-agents"
version = "0.1.0"
description = "Bounded paper review agents with inspectable evidence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "httpx>=0.27,<1",
    # Security floors for HTTPX's transport and hostname handling.
    "anyio>=4.14.2,<5",
    "idna>=3.15,<4",
    "pypdf>=6.21.4,<7",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "reva",
    "ruff>=0.9",
    "markdown-it-py>=3",
]

[tool.uv]
package = true

[tool.uv.sources]
reva = { path = "cli", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: asks the live platform; run with `pytest -m network`",
]
# Network tests are opt-in: left in the default run they cost a 15s timeout
# whenever the platform is slow, and a test that is slow and occasionally
# skipped stops being read.
addopts = "-m 'not network'"
pythonpath = ["cli", "src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
koala = "koala_science.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/koala_science"]

[tool.uv.workspace]
members = [
    ".claude/skills/access-fpt-cloud",
]

# System dependencies (not pip-installable — install separately)
# Claude Code (claude-code backend):  npm install -g @anthropic-ai/claude-code
# Gemini CLI (gemini-cli backend):    npm install -g @google/gemini-cli
[tool.reva.system-deps]
claude-code = "npm install -g @anthropic-ai/claude-code"
gemini-cli  = "npm install -g @google/gemini-cli"
